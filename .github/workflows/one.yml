name: Fetch, Parse & Update Daily Sun + Samakal Opinion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch_parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FlareSolverr container
        run: |
          docker run -d --name flaresolverr -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
          sleep 10

      - name: Fetch Samakal Opinion HTML
        run: python fetch.py

      - name: Fetch Daily Sun Print Version & Subcategories HTMLs
        run: python fetch_htmls.py

      - name: Parse Daily Sun HTMLs to XML
        run: python parse_to_xml.py

      - name: Commit all HTML and XML files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add *.html *.xml
          git commit -m "Automated fetch & parse update" || echo "No changes"
          git push